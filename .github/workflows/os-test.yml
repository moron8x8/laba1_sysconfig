name: Cross-platform OS test

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-os:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run main.py
        run: python main.py

      - name: Upload system configuration
        uses: actions/upload-artifact@v4
        with:
          name: sys-config-${{ matrix.os }}
          path: sys_config.json
          if-no-files-found: error
